  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #2a1419;
      background: linear-gradient(180deg, #361b23, #1b0e13);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* full-bleed: cover the whole device incl. safe areas (fixes iOS home-screen
       dark bars). The HUD insets itself by the safe areas; the canvas does not. */
    /* touch-action:none must live on the actual touch target (the canvas), not
       just body — otherwise iOS treats a drag near the screen bottom as a
       browser toolbar/scroll gesture, fires pointercancel, and the joystick
       dies mid-steer (a dead band ~3/4 down the screen). */
    #game { position: fixed; inset: 0; touch-action: none; }
    #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #e8e4d8;
      font-family: Georgia, 'Times New Roman', serif;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #loading .title { font-size: 34px; letter-spacing: 3px; animation: loadrise 0.8s cubic-bezier(0.22,1,0.36,1) both; }
    #loading .rule { width: 0; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #d8b94a, transparent);
      animation: loadrule 0.9s 0.25s cubic-bezier(0.22,1,0.36,1) both; }
    #loading .sub { font-size: 13px; letter-spacing: 2px; opacity: 0.7;
      font-family: -apple-system, system-ui, sans-serif; animation: loadpulse 1.9s 0.6s ease-in-out infinite; }
    @keyframes loadrise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes loadrule { from { width: 0; opacity: 0; } to { width: 220px; opacity: 1; } }
    @keyframes loadpulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      #loading .title, #loading .rule, #loading .sub { animation: none; }
      #loading .rule { width: 220px; }
    }
  </style>
  <script>window.__townPath = "/";</script>

  <div id="game"></div>
  <div id="loading">
    <div class="title">CLIPPER TOWN</div>
    <div class="rule"></div>
    <div class="sub">Exploring Newburyport, Massachusetts</div>
  </div>
  <!-- GoatCounter analytics (privacy-friendly). Kept in source so every build keeps it —
       it was previously added only on the deploy branch and got wiped by each deploy. -->
