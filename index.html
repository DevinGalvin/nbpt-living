<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="%B_APPLE_TITLE%" />
  <meta name="theme-color" content="%B_THEME_COLOR%" />
  <title>%B_HTML_TITLE%</title>
  <meta name="description" content="%B_DESCRIPTION%" />
  <!-- Social link previews (Open Graph + Twitter Card). Absolute URLs so the card unfurls. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="%B_OG_SITE_NAME%" />
  <meta property="og:title" content="%B_HTML_TITLE%" />
  <meta property="og:description" content="%B_OG_DESCRIPTION%" />
  <meta property="og:url" content="%B_OG_URL%" />
  <meta property="og:image" content="%B_OG_IMAGE%" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:type" content="%B_OG_IMAGE_TYPE%" />
  <meta property="og:image:alt" content="%B_OG_IMAGE_ALT%" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="%B_HTML_TITLE%" />
  <meta name="twitter:description" content="%B_TWITTER_DESCRIPTION%" />
  <meta name="twitter:image" content="%B_OG_IMAGE%" />
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: %B_THEME_COLOR%;
      background: linear-gradient(180deg, %B_BG_TOP%, %B_BG_BOTTOM%);
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* full-bleed: cover the whole device incl. safe areas (fixes iOS home-screen
       dark bars). The HUD insets itself by the safe areas; the canvas does not. */
    /* touch-action:none must live on the actual touch target (the canvas), not
       just body — otherwise iOS treats a drag near the screen bottom as a
       browser toolbar/scroll gesture, fires pointercancel, and the joystick
       dies mid-steer (a dead band ~3/4 down the screen). */
    #game { position: fixed; inset: 0; touch-action: none; }
    #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #e8e4d8;
      font-family: Georgia, 'Times New Roman', serif;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }
    #loading .title { font-size: 34px; letter-spacing: 3px; animation: loadrise 0.8s cubic-bezier(0.22,1,0.36,1) both; }
    #loading .rule { width: 0; height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, %B_RULE_COLOR%, transparent);
      animation: loadrule 0.9s 0.25s cubic-bezier(0.22,1,0.36,1) both; }
    #loading .sub { font-size: 13px; letter-spacing: 2px; opacity: 0.7;
      font-family: -apple-system, system-ui, sans-serif; animation: loadpulse 1.9s 0.6s ease-in-out infinite; }
    @keyframes loadrise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes loadrule { from { width: 0; opacity: 0; } to { width: 220px; opacity: 1; } }
    @keyframes loadpulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) {
      #loading .title, #loading .rule, #loading .sub { animation: none; }
      #loading .rule { width: 220px; }
    }
  </style>
  %TOWN_BOOT%
</head>
<body>
  <div id="game"></div>
  <div id="loading">
    <div class="title">%B_LOADING_TITLE%</div>
    <div class="rule"></div>
    <div class="sub">%B_LOADING_SUB%</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <!-- GoatCounter analytics (privacy-friendly). Kept in source so every build keeps it —
       it was previously added only on the deploy branch and got wiped by each deploy. -->
  <script data-goatcounter="https://clipper.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
